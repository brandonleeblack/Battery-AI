<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Battery: glass style samples</title>
<style>
  :root { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  body { margin: 0; background: #15161b; color: #e8e8ec; }
  body.light { background: #eef0f4; color: #17181c; }
  header { display: flex; align-items: center; gap: 16px; padding: 20px 28px 8px; }
  header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  header p { margin: 0; font-size: 13px; opacity: .7; }
  .toggle { margin-left: auto; display: flex; border-radius: 8px; overflow: hidden; border: 1px solid #fff3; }
  body.light .toggle { border-color: #0002; }
  .toggle button { background: none; border: 0; color: inherit; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .toggle button.on { background: #ffffff22; }
  body.light .toggle button.on { background: #0000000f; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(560px, 100%), 1fr)); gap: 20px; padding: 16px 28px 32px; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .card .sub { font-size: 12.5px; opacity: .7; margin: 0 0 10px; line-height: 1.45; }

  /* Fake desktop: wallpaper + Windows 11 taskbar */
  .desk { position: relative; height: 430px; min-width: 480px; border-radius: 10px; overflow: hidden;
          background:
            radial-gradient(60% 80% at 78% 30%, #6a5cff 0%, transparent 60%),
            radial-gradient(50% 70% at 30% 70%, #00a3c4 0%, transparent 65%),
            radial-gradient(40% 50% at 95% 95%, #ff7a59 0%, transparent 70%),
            #101425; }
  body.light .desk { background:
            radial-gradient(60% 80% at 78% 30%, #b6c4ff 0%, transparent 60%),
            radial-gradient(50% 70% at 30% 70%, #8fe3f0 0%, transparent 65%),
            radial-gradient(40% 50% at 95% 95%, #ffc7b3 0%, transparent 70%),
            #e4e9f5; }
  .window { position: absolute; left: 18px; top: 18px; width: 230px; height: 150px; border-radius: 8px;
            background: #1f2230; box-shadow: 0 8px 30px #0006; }
  body.light .window { background: #fbfbfd; box-shadow: 0 8px 30px #0002; }
  .window::before { content: ""; position: absolute; left: 14px; right: 14px; top: 40px; height: 6px; border-radius: 3px;
                    background: repeating-linear-gradient(#ffffff18 0 6px, transparent 6px 16px); height: 90px; }
  body.light .window::before { background: repeating-linear-gradient(#00000012 0 6px, transparent 6px 16px); }
  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
             background: #1c1d24cc; backdrop-filter: blur(30px) saturate(1.4); border-top: 1px solid #ffffff14;
             display: flex; align-items: center; }
  body.light .taskbar { background: #f3f3f3d9; border-top-color: #0000000f; }
  .icons { margin: 0 auto; display: flex; gap: 6px; }
  .icons i { width: 32px; height: 32px; border-radius: 6px; background: #ffffff14; display: block; }
  body.light .icons i { background: #0000000d; }
  .tray { position: absolute; right: 10px; top: 0; bottom: 0; display: flex; align-items: center; gap: 12px; font-size: 12px; }
  .tray .clock { text-align: right; line-height: 1.25; }
  .slot { position: absolute; right: 118px; bottom: 7px; }

  /* Strip contents (shared) */
  .strip { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; position: relative; }
  .group { display: flex; align-items: center; gap: 4px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .bars { display: flex; flex-direction: column; gap: 4px; }
  .bar { position: relative; width: 28px; height: 6px; border-radius: 2px; background: var(--track); }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--normal); }
  .bar.ahead .fill { background: var(--ahead); }
  .bar.low .fill { background: var(--low); }
  .bar .clockline { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--clock); border-radius: 1px; }
  .bar.ns .fill { display: none; }

  /* Hover panel (shared) */
  .panel { position: absolute; right: 70px; bottom: 60px; width: 250px; padding: 12px 14px; border-radius: 8px; font-size: 12px; }
  .panel .app { display: flex; align-items: center; gap: 6px; font-weight: 600; margin: 0 0 6px; }
  .panel .app + .row { margin-top: 0; }
  .panel .row { display: grid; grid-template-columns: 26px 1fr 30px 50px; gap: 8px; align-items: center; margin: 4px 0; }
  .panel .row .lbl, .panel .row .t { color: var(--secondary); }
  .panel .row .pct { text-align: right; font-variant-numeric: tabular-nums; }
  .panel .row .t { text-align: right; }
  .panel .row .bar { width: 100%; height: 6px; border-radius: 3px; }
  .panel .row .bar .fill { border-radius: 3px; }
  .panel .sec + .sec { margin-top: 10px; }
  .panel .foot { margin-top: 8px; font-size: 11px; color: var(--secondary); }

  /* ---------- A. Frosted acrylic ---------- */
  .A { --track:#ffffff26; --normal:#d9dbe4; --ahead:#ffc55c; --low:#ff7676; --clock:#fff; --secondary:#c9cbd6; }
  .A .strip, .A .panel { background: #2a2c36a6; backdrop-filter: blur(24px) saturate(1.6);
                         border: 1px solid #ffffff1f; box-shadow: 0 1px 0 #ffffff14 inset, 0 6px 20px #0005; color: #f1f1f4; }
  body.light .A { --track:#0000001a; --normal:#4d5262; --ahead:#c77700; --low:#d13438; --clock:#111318; --secondary:#4a4d57; }
  body.light .A .strip, body.light .A .panel { background: #ffffffb3; border-color: #ffffffcc;
                         box-shadow: 0 0 0 1px #0000000f, 0 6px 20px #0000001f; color: #17181c; }

  /* ---------- B. Clear glass ---------- */
  .B { --track:#ffffff2e; --normal:#ffffffe6; --ahead:#ffc55c; --low:#ff7676; --clock:#fff; --secondary:#d4d6de; }
  .B .strip { background: #ffffff0a; border: 1px solid #ffffff26; }
  .B .bar { box-shadow: 0 0 0 .5px #ffffff20 inset; }
  .B .panel { background: #ffffff10; backdrop-filter: blur(10px) saturate(1.3); border: 1px solid #ffffff30; color: #fff;
              text-shadow: 0 1px 2px #0007; }
  body.light .B { --track:#00000014; --normal:#2c303b; --ahead:#b86e00; --low:#c42b2f; --clock:#000; --secondary:#30333c; }
  body.light .B .strip { background: #ffffff2e; border-color: #ffffff99; }
  body.light .B .panel { background: #ffffff40; border-color: #ffffffb3; color: #111; text-shadow: none; }

  /* ---------- C. Liquid glass ---------- */
  .C { --track:#00000040; --normal:#f2f3f7; --ahead:#ffcb6b; --low:#ff8080; --clock:#fff; --secondary:#d7d9e2; }
  .C .strip, .C .panel { color: #fff; backdrop-filter: blur(14px) saturate(1.9) brightness(1.08);
       background: linear-gradient(180deg, #ffffff2e 0%, #ffffff0d 45%, #ffffff08 55%, #ffffff1c 100%);
       border: 1px solid #ffffff3d;
       box-shadow: inset 0 1px 0 #ffffff8c, inset 0 -1px 0 #ffffff26, inset 0 0 12px #ffffff14, 0 8px 24px #0006; }
  .C .strip { border-radius: 14px; padding: 8px 12px; }
  .C .panel { border-radius: 16px; }
  .C .bar { box-shadow: inset 0 1px 1px #0005; }
  .C .bar .fill { background: linear-gradient(180deg, color-mix(in srgb, var(--normal) 100%, #fff) , color-mix(in srgb, var(--normal) 80%, #000)); }
  .C .bar.ahead .fill { background: linear-gradient(180deg, #ffe0a0, var(--ahead)); }
  .C .bar.low .fill { background: linear-gradient(180deg, #ffb3b3, var(--low)); }
  body.light .C { --track:#0000001f; --normal:#3d4252; --ahead:#c77700; --low:#d13438; --clock:#0b0c10; --secondary:#3c3f49; }
  body.light .C .strip, body.light .C .panel { color: #121318;
       background: linear-gradient(180deg, #ffffffcc 0%, #ffffff80 50%, #ffffff99 100%);
       border-color: #ffffffe6; box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 #ffffff80, 0 8px 24px #0000002a, 0 0 0 1px #0000000d; }
  body.light .C .bar .fill { background: linear-gradient(180deg, #6b7183, var(--normal)); }
  body.light .C .bar.ahead .fill { background: linear-gradient(180deg, #e9a030, var(--ahead)); }
  body.light .C .bar.low .fill { background: linear-gradient(180deg, #ee6a6d, var(--low)); }

  /* ---------- D. Tinted capsules ---------- */
  .D { --track:#ffffff24; --normal:#eceef4; --ahead:#ffc55c; --low:#ff7676; --clock:#fff; --secondary:#cfd1da; }
  .D .strip { background: none; padding: 0; gap: 6px; }
  .D .group { padding: 7px 8px; border-radius: 9px; backdrop-filter: blur(20px) saturate(1.6);
              background: color-mix(in srgb, var(--tint) 22%, #22242ccc); border: 1px solid color-mix(in srgb, var(--tint) 45%, transparent);
              box-shadow: inset 0 1px 0 #ffffff1f; }
  .D .panel { background: #23252ec4; backdrop-filter: blur(24px) saturate(1.6); border: 1px solid #ffffff1f; color: #f1f1f4;
              box-shadow: 0 6px 20px #0005; }
  .D .panel .sec { padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--tint) 14%, transparent);
                   border: 1px solid color-mix(in srgb, var(--tint) 30%, transparent); }
  .D .panel .sec + .sec { margin-top: 6px; }
  body.light .D { --track:#00000017; --normal:#454a5a; --ahead:#c77700; --low:#d13438; --clock:#111318; --secondary:#454852; }
  body.light .D .group { background: color-mix(in srgb, var(--tint) 18%, #ffffffbf); border-color: color-mix(in srgb, var(--tint) 55%, transparent);
                         box-shadow: inset 0 1px 0 #fff; }
  body.light .D .panel { background: #ffffffc2; color: #17181c; border-color: #ffffffd9; box-shadow: 0 0 0 1px #0000000f, 0 6px 20px #0000001f; }

  /* ---------- Current (for comparison) ---------- */
  .Z { --track:#4A4C58; --normal:#C4C7D2; --ahead:#F2B84B; --low:#FF6B6B; --clock:#FFFFFF; --secondary:#A6A8B3; }
  .Z .strip { background: #2D2F37; }
  .Z .panel { background: #26272E; border: 1px solid #34363F; color: #EDEDF0; }
  body.light .Z { --track:#D5D8E0; --normal:#5A5F6E; --ahead:#C77700; --low:#D13438; --clock:#111318; --secondary:#454852; }
  body.light .Z .strip { background: #fff; border: 1px solid #CFD2DA; }
  body.light .Z .panel { background: #fff; border-color: #CFD2DA; color: #111318; }

  .note { font-size: 12px; opacity: .75; margin-top: 8px; line-height: 1.45; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Battery: glass samples</h1>
    <p>Same data in every sample: Claude ahead of pace, Codex weekly low, OpenCode 5-hour not started.</p>
  </div>
  <div class="toggle"><button id="dark" class="on">Graphite (dark)</button><button id="light">Daylight (light)</button></div>
</header>
<div class="grid" id="grid"></div>
<script>
const apps = [
  { name: "Claude",      dot: "#E08A5B", rows: [{ k: "5h", u: 56, c: 40, st: "ahead", t: "2h 14m" }, { k: "Week", u: 34, c: 55, t: "3d 4h" }] },
  { name: "Codex",       dot: "#7FB0FF", rows: [{ k: "5h", u: 12, c: 30, t: "3h 30m" }, { k: "Week", u: 85, c: 70, st: "low", t: "2d 1h" }] },
  { name: "OpenCode Go", dot: "#5CC8B0", rows: [{ k: "5h", u: 0, c: 0, st: "ns", t: "not started" }, { k: "Week", u: 22, c: 48, t: "3d 15h" }, { k: "Month", u: 9, c: 30, t: "21d" }] },
];
const bar = r => `<div class="bar ${r.st || ""}"><div class="fill" style="width:${r.u}%"></div>${r.st === "ns" ? "" : `<div class="clockline" style="left:calc(${r.c}% - 1px)"></div>`}</div>`;
const strip = () => `<div class="strip">${apps.map(a => `<div class="group" style="--tint:${a.dot}"><div class="dot" style="background:${a.dot}"></div><div class="bars">${bar(a.rows[0])}${bar(a.rows[1])}</div></div>`).join("")}</div>`;
const panel = () => `<div class="panel">${apps.map(a => `<div class="sec" style="--tint:${a.dot}"><div class="app"><span class="dot" style="background:${a.dot}"></span>${a.name}</div>${a.rows.map(r => `<div class="row"><span class="lbl">${r.k}</span>${bar(r)}<span class="pct">${r.st === "ns" ? "" : r.u + "%"}</span><span class="t">${r.t}</span></div>`).join("")}</div>`).join("")}<div class="foot">updated 2m ago</div></div>`;
const samples = [
  { c: "A", t: "A · Frosted acrylic", s: "Windows 11's own material: tinted, heavily blurred, a faint top highlight. Sits closest to the taskbar it floats on." },
  { c: "B", t: "B · Clear glass", s: "Almost no tint, just a hairline edge; the bars carry everything. Lightest touch, but legibility depends on the wallpaper." },
  { c: "C", t: "C · Liquid glass", s: "Thick, glossy pane: bright top edge, inner glow, rounded pill, bars with a slight bevel. The most decorative." },
  { c: "D", t: "D · Tinted capsules", s: "Each app in its own small glass capsule tinted with its identity colour; the panel repeats the tint per section." },
  { c: "Z", t: "Current · Solid Graphite / Daylight", s: "Today's flat box, for comparison." },
];
document.getElementById("grid").innerHTML = samples.map(x => `
  <div class="card ${x.c}">
    <h2>${x.t}</h2><p class="sub">${x.s}</p>
    <div class="desk">
      <div class="window"></div>
      ${panel()}
      <div class="taskbar"><div class="icons"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="tray"><span>ENG</span><div class="clock">10:42 AM<br>11/24/2026</div></div></div>
      <div class="slot">${strip()}</div>
    </div>
  </div>`).join("");
const set = light => { document.body.classList.toggle("light", light);
  document.getElementById("light").classList.toggle("on", light); document.getElementById("dark").classList.toggle("on", !light); };
document.getElementById("dark").onclick = () => set(false);
document.getElementById("light").onclick = () => set(true);
if (matchMedia("(prefers-color-scheme: light)").matches) set(true);
</script>
</body>
</html>
