<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Battery: bar styles on frosted acrylic</title>
<style>
  :root { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  body { margin: 0; background: #15161b; color: #e8e8ec; }
  body.light { background: #eef0f4; color: #17181c; }
  header { display: flex; align-items: center; gap: 16px; padding: 20px 28px 8px; flex-wrap: wrap; }
  header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  header p { margin: 0; font-size: 13px; opacity: .7; }
  .toggle { margin-left: auto; display: flex; border-radius: 8px; overflow: hidden; border: 1px solid #fff3; }
  body.light .toggle { border-color: #0002; }
  .toggle button { background: none; border: 0; color: inherit; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .toggle button.on { background: #ffffff22; }
  body.light .toggle button.on { background: #0000000f; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(560px, 100%), 1fr)); gap: 24px; padding: 16px 28px 32px; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .card .sub { font-size: 12.5px; opacity: .7; margin: 0 0 10px; line-height: 1.45; }

  .desk { position: relative; height: 520px; min-width: 500px; border-radius: 10px; overflow: hidden;
          background:
            radial-gradient(60% 80% at 78% 30%, #6a5cff 0%, transparent 60%),
            radial-gradient(50% 70% at 30% 70%, #00a3c4 0%, transparent 65%),
            radial-gradient(40% 50% at 95% 95%, #ff7a59 0%, transparent 70%),
            #101425; }
  body.light .desk { background:
            radial-gradient(60% 80% at 78% 30%, #b6c4ff 0%, transparent 60%),
            radial-gradient(50% 70% at 30% 70%, #8fe3f0 0%, transparent 65%),
            radial-gradient(40% 50% at 95% 95%, #ffc7b3 0%, transparent 70%),
            #e4e9f5; }
  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
             background: #1c1d24cc; backdrop-filter: blur(30px) saturate(1.4); border-top: 1px solid #ffffff14; }
  body.light .taskbar { background: #f3f3f3d9; border-top-color: #0000000f; }
  .tray { position: absolute; right: 10px; top: 0; bottom: 0; display: flex; align-items: center; gap: 12px; font-size: 12px; }
  .tray .clock { text-align: right; line-height: 1.25; }
  .slot { position: absolute; right: 118px; bottom: 7px; }
  .zoom { position: absolute; left: 22px; top: 22px; transform: scale(3); transform-origin: top left; }
  .zoomlbl { position: absolute; left: 22px; top: 4px; font-size: 11px; opacity: .65; }

  /* Frosted acrylic surface (style A) */
  .card { --track:#ffffff26; --normal:#d9dbe4; --ahead:#ffc55c; --low:#ff7676; --clock:#fff; --secondary:#c9cbd6; --ink:#f1f1f4; }
  body.light .card { --track:#0000001a; --normal:#4d5262; --ahead:#c77700; --low:#d13438; --clock:#111318; --secondary:#4a4d57; --ink:#17181c; }
  .glass { background: #2a2c36a6; backdrop-filter: blur(24px) saturate(1.6); border: 1px solid #ffffff1f;
           box-shadow: 0 1px 0 #ffffff14 inset, 0 6px 20px #0005; color: var(--ink); }
  body.light .glass { background: #ffffffb3; border-color: #ffffffcc; box-shadow: 0 0 0 1px #0000000f, 0 6px 20px #0000001f; }

  .strip { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; }
  .group { display: flex; align-items: center; gap: 4px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .bars { display: flex; flex-direction: column; gap: var(--gap, 4px); }

  /* Bar base: each variant overrides via its class */
  .bar { position: relative; width: 28px; height: var(--h, 6px); border-radius: var(--r, 2px); background: var(--track); }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: var(--r, 2px); background: var(--c); }
  .bar { --c: var(--normal); } .bar.ahead { --c: var(--ahead); } .bar.low { --c: var(--low); }
  .bar .clockline { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: var(--clock); border-radius: 1px; }
  .bar.ns .fill { display: none; }

  .panel { position: absolute; right: 70px; bottom: 60px; width: 250px; padding: 12px 14px; border-radius: 8px; font-size: 12px; }
  .panel .app { display: flex; align-items: center; gap: 6px; font-weight: 600; margin: 0 0 6px; }
  .panel .row { display: grid; grid-template-columns: 34px 1fr 30px 62px; gap: 8px; align-items: center; margin: 5px 0; }
  .panel .row .lbl, .panel .row .t { color: var(--secondary); }
  .panel .row .pct { text-align: right; font-variant-numeric: tabular-nums; }
  .panel .row .t { text-align: right; }
  .panel .row .bar { width: 100%; --h: calc(var(--ph, 8px)); }
  .panel .sec + .sec { margin-top: 10px; }
  .panel .foot { margin-top: 8px; font-size: 11px; color: var(--secondary); }

  /* 1. Clean: today's shapes, translucent track */
  .v1 .panel .row .bar { --r: 4px; }

  /* 2. Soft pills: fully round ends, clock as a short tick that rises above */
  .v2 .bar { --h: 5px; --r: 3px; }
  .v2 .panel .row .bar { --ph: 7px; --r: 4px; }
  .v2 .bar .clockline { top: -3px; bottom: 1px; width: 2px; }

  /* 3. Hairlines: thin bars, clock as a dot riding the bar */
  .v3 .bars { --gap: 6px; }
  .v3 .bar { --h: 3px; --r: 2px; }
  .v3 .panel .row .bar { --ph: 4px; }
  .v3 .bar .clockline { top: 50%; bottom: auto; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%;
                        box-shadow: 0 0 0 1px #00000055; }
  body.light .v3 .bar .clockline { box-shadow: 0 0 0 1px #ffffffaa; }

  /* 4. Glass gel: inset groove for the track, fill with a light top edge */
  .v4 .bar { background: #00000040; box-shadow: inset 0 1px 1.5px #00000080, 0 1px 0 #ffffff14; }
  body.light .v4 .bar { background: #0000000f; box-shadow: inset 0 1px 1.5px #00000033, 0 1px 0 #ffffffcc; }
  .v4 .bar .fill { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 55%, #fff) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 85%, #000) 100%); }
  .v4 .panel .row .bar { --r: 4px; }

  /* 5. Cells: battery-style segments */
  .v5 .bar { background: none; }
  .v5 .bar::before, .v5 .bar .fill { -webkit-mask: repeating-linear-gradient(90deg, #000 0 4.4px, transparent 4.4px 5.6px);
                                     mask: repeating-linear-gradient(90deg, #000 0 4.4px, transparent 4.4px 5.6px); }
  .v5 .bar::before { content: ""; position: absolute; inset: 0; background: var(--track); border-radius: 1px; }
  .v5 .bar .fill { border-radius: 1px; }
  .v5 .panel .row .bar::before, .v5 .panel .row .bar .fill { -webkit-mask: repeating-linear-gradient(90deg, #000 0 9%, transparent 9% 10%);
                                                            mask: repeating-linear-gradient(90deg, #000 0 9%, transparent 9% 10%); }

  /* 6. Glow on warning: amber and red bars light up; normal stays quiet */
  .v6 .bar.ahead .fill, .v6 .bar.low .fill { box-shadow: 0 0 6px color-mix(in srgb, var(--c) 80%, transparent); }
  .v6 .bar.ahead, .v6 .bar.low { background: color-mix(in srgb, var(--c) 22%, transparent); }
  body.light .v6 .bar.ahead .fill, body.light .v6 .bar.low .fill { box-shadow: 0 0 5px color-mix(in srgb, var(--c) 55%, transparent); }
  .v6 .panel .row .bar { --r: 4px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Bar styles on frosted acrylic</h1>
    <p>Every sample uses style A's surface. Top left: the strip at 3× size. Bottom: actual size on the taskbar, hover panel above.</p>
  </div>
  <div class="toggle"><button id="dark" class="on">Graphite (dark)</button><button id="light">Daylight (light)</button></div>
</header>
<div class="grid" id="grid"></div>
<script>
const apps = [
  { name: "Claude",      dot: "#E08A5B", rows: [{ k: "5h", u: 56, c: 40, st: "ahead", t: "2h 14m" }, { k: "Week", u: 34, c: 55, t: "3d 4h" }] },
  { name: "Codex",       dot: "#7FB0FF", rows: [{ k: "5h", u: 12, c: 30, t: "3h 30m" }, { k: "Week", u: 85, c: 70, st: "low", t: "2d 1h" }] },
  { name: "OpenCode Go", dot: "#5CC8B0", rows: [{ k: "5h", u: 0, c: 0, st: "ns", t: "not started" }, { k: "Week", u: 22, c: 48, t: "3d 15h" }, { k: "Month", u: 9, c: 30, t: "21d" }] },
];
const bar = r => `<div class="bar ${r.st || ""}"><div class="fill" style="width:${r.u}%"></div>${r.st === "ns" ? "" : `<div class="clockline" style="left:${r.c}%"></div>`}</div>`;
const strip = () => `<div class="strip glass">${apps.map(a => `<div class="group"><div class="dot" style="background:${a.dot}"></div><div class="bars">${bar(a.rows[0])}${bar(a.rows[1])}</div></div>`).join("")}</div>`;
const panel = () => `<div class="panel glass">${apps.map(a => `<div class="sec"><div class="app"><span class="dot" style="background:${a.dot}"></span>${a.name}</div>${a.rows.map(r => `<div class="row"><span class="lbl">${r.k}</span>${bar(r)}<span class="pct">${r.st === "ns" ? "" : r.u + "%"}</span><span class="t">${r.t}</span></div>`).join("")}</div>`).join("")}<div class="foot">updated 2m ago</div></div>`;
const samples = [
  { c: "v1", t: "1 · Clean", s: "Today's bars as they are, with a see-through track so the glass shows through. The safe baseline." },
  { c: "v2", t: "2 · Soft pills", s: "Slightly thinner with round ends; the clock becomes a short tick rising above the bar, so it never hides the fill edge." },
  { c: "v3", t: "3 · Hairlines", s: "3px lines with a little more air between them; the clock is a dot riding on the line. Airiest, matches the thin acrylic edge." },
  { c: "v4", t: "4 · Glass gel", s: "The track is pressed into the glass as a groove; the fill has a light top edge like a filled tube. Most 'material'." },
  { c: "v5", t: "5 · Cells", s: "Bars split into battery cells. Reads as a battery at a glance; less precise between cells." },
  { c: "v6", t: "6 · Glow on warning", s: "Normal bars stay quiet; amber and red fills glow softly and tint their track, so trouble is the only thing that stands out." },
];
document.getElementById("grid").innerHTML = samples.map(x => `
  <div class="card ${x.c}">
    <h2>${x.t}</h2><p class="sub">${x.s}</p>
    <div class="desk">
      <div class="zoomlbl">3×</div>
      <div class="zoom">${strip()}</div>
      ${panel()}
      <div class="taskbar"><div class="tray"><span>ENG</span><div class="clock">10:42 AM<br>11/24/2026</div></div></div>
      <div class="slot">${strip()}</div>
    </div>
  </div>`).join("");
const set = light => { document.body.classList.toggle("light", light);
  document.getElementById("light").classList.toggle("on", light); document.getElementById("dark").classList.toggle("on", !light); };
document.getElementById("dark").onclick = () => set(false);
document.getElementById("light").onclick = () => set(true);
if (matchMedia("(prefers-color-scheme: light)").matches) set(true);
</script>
</body>
</html>
